name: Fix goal time parser
on:
  push:
    paths:
      - '.github/workflows/fix-time-parser.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bot.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bot.py')
          s=p.read_text(encoding='utf-8')
          marker='\n# === FINAL ROBUST GOAL TIME PARSER 2026-09-08 ===\n'
          if marker not in s:
              block=r'''

# === FINAL ROBUST GOAL TIME PARSER 2026-09-08 ===
def parse_time(value):
    """Parse Persian/Arabic/ASCII clock input as HH:MM."""
    if value is None:
        return None
    text = str(value).strip()
    trans = str.maketrans("۰۱۲۳۴۵۶۷۸۹٠١٢٣٤٥٦٧٨٩", "01234567890123456789")
    text = text.translate(trans)
    text = text.replace("：", ":").replace("٫", ":").replace("．", ".").replace("،", ":")
    text = re.sub(r"\s+", "", text)
    m = re.fullmatch(r"([01]?\d|2[0-3])[:.]([0-5]\d)", text)
    if not m:
        m = re.fullmatch(r"([01]?\d|2[0-3])([0-5]\d)", text)
    if not m:
        return None
    return f"{int(m.group(1)):02d}:{int(m.group(2)):02d}"
'''
              s += block
              p.write_text(s,encoding='utf-8')
          compile(s,'bot.py','exec')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git diff --cached --quiet || git commit -m 'Fix goal time input lock and Persian digits'
          git push
