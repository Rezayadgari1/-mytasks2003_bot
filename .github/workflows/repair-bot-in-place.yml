name: Repair bot.py in place

on:
  push:
    branches: [main]

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair bot.py
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')

          # The repository accumulated final navigation definitions after the
          # original startup call. Python executes main() immediately at the
          # first __main__ block, so those later fixes never became active.
          # Keep one startup call only, and place it after every definition.
          block = '\nif __name__ == "__main__":\n    main()\n'
          s = s.replace(block, '\n')
          s = re.sub(r'\nif __name__\s*==\s*["\']__main__["\']\s*:\s*\n\s*main\(\)\s*\n?', '\n', s)

          # Avoid negotiating SQLite WAL mode on every button/callback.
          # Keep the existing retry/lock design intact.
          if '_DB_WAL_READY' not in s:
              if '_DB_PRAGMA_LOCK = threading.RLock()' in s:
                  s = s.replace('_DB_PRAGMA_LOCK = threading.RLock()', '_DB_PRAGMA_LOCK = threading.RLock()\n_DB_WAL_READY = False', 1)
              else:
                  anchor = 'logger = logging.getLogger(__name__)'
                  if anchor in s:
                      s = s.replace(anchor, anchor + '\n_DB_WAL_READY = False\n_DB_WAL_LOCK = threading.RLock()', 1)

          # Guard the database-level WAL negotiation if the current db() still
          # performs it for every connection. This is deliberately conservative.
          if 'PRAGMA journal_mode=WAL' in s and 'global _DB_WAL_READY' not in s:
              pat = r'(?P<indent>\s*)c\.execute\(["\']PRAGMA journal_mode=WAL["\']\)'
              def repl(m):
                  ind = m.group('indent')
                  return (f'{ind}global _DB_WAL_READY\n'
                          f'{ind}if not _DB_WAL_READY:\n'
                          f'{ind}    with _DB_PRAGMA_LOCK:\n'
                          f'{ind}        if not _DB_WAL_READY:\n'
                          f'{ind}            try:\n'
                          f'{ind}                c.execute("PRAGMA journal_mode=WAL")\n'
                          f'{ind}            except sqlite3.OperationalError:\n'
                          f'{ind}                pass\n'
                          f'{ind}            _DB_WAL_READY = True')
              s, n = re.subn(pat, repl, s, count=1)
              if n == 0:
                  # Different db() implementations may already have a lock.
                  pass

          s = s.rstrip() + '\n\n# Startup must be last so every final router/navigation definition is active.\nif __name__ == "__main__":\n    main()\n'
          p.write_text(s, encoding='utf-8')
          PY

          python3 -m py_compile bot.py config.py database.py
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git diff --cached --quiet || git commit -m 'Fix bot navigation startup order and SQLite callback latency'
          git push
