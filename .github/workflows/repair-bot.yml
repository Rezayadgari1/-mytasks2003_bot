name: One-time bot repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor == 'Rezayadgari1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair bot.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')

          # Fix feature alias that made the visible goal edit button fail its gate.
          if '"edit": "goals"' not in s:
              old = '"goals": "goals",\n    "reminders": "reminders"'
              new = '"goals": "goals", "edit": "goals",\n    "reminders": "reminders"'
              if old not in s:
                  raise SystemExit('feature alias insertion point not found')
              s = s.replace(old, new, 1)

          # Make parse_time deterministic and Persian-digit safe.
          marker = 'def parse_time(s):\n'
          start = s.find(marker)
          if start < 0:
              raise SystemExit('parse_time not found')
          end = s.find('\ndef ', start + len(marker))
          if end < 0:
              raise SystemExit('parse_time end not found')
          replacement = '''def parse_time(s):\n    """Parse goal/reminder time and return normalized HH:MM."""\n    if s is None:\n        return None\n    s = normalize_digits(str(s).strip()).replace("：", ":").replace(".", ":")\n    s = re.sub(r"\\s+", "", s)\n    if not s:\n        return None\n    if s.isdigit():\n        if len(s) <= 2:\n            h, m = int(s), 0\n        elif len(s) == 3:\n            h, m = int(s[0]), int(s[1:])\n        elif len(s) == 4:\n            h, m = int(s[:2]), int(s[2:])\n        else:\n            return None\n    else:\n        mobj = re.fullmatch(r"(\\d{1,2}):(\\d{1,2})", s)\n        if not mobj:\n            return None\n        h, m = int(mobj.group(1)), int(mobj.group(2))\n    if not (0 <= h <= 23 and 0 <= m <= 59):\n        return None\n    return f"{h:02d}:{m:02d}"\n'''
          s = s[:start] + replacement + s[end:]

          # Final routing repair. It runs before main() registers handlers.
          guard = '# === ONE-TIME BUTTON/TIME REPAIR 2026-09-08 ==='
          if guard not in s:
              pos = s.rfind('if __name__ == "__main__":')
              if pos < 0:
                  raise SystemExit('main guard not found')
              patch = '''# === ONE-TIME BUTTON/TIME REPAIR 2026-09-08 ===\n_FINAL_REPAIR_FEATURE_ALIASES = {"edit": "goals", "calendar": "calendar_hub"}\n_FINAL_REPAIR_OLD_FEATURE_ALLOWED = user_feature_allowed\ndef user_feature_allowed(uid, key):\n    key = _FINAL_REPAIR_FEATURE_ALIASES.get(str(key or ""), str(key or ""))\n    return _FINAL_REPAIR_OLD_FEATURE_ALLOWED(uid, key)\n\n_FINAL_REPAIR_OLD_CUSTOM_TIME_SAVE = custom_time_save\nasync def custom_time_save(update, context):\n    if not context.user_data.get("awaiting_custom_time"):\n        return await _FINAL_REPAIR_OLD_CUSTOM_TIME_SAVE(update, context)\n    text = (getattr(update.message, "text", "") or "").strip()\n    tm = parse_time(text)\n    if tm is None:\n        await update.message.reply_text("❌ ساعت نامعتبر است. مثال: 18:30 یا ۱۸:۳۰")\n        return True\n    context.user_data["_final_manual_goal_time"] = tm\n    return await _FINAL_REPAIR_OLD_CUSTOM_TIME_SAVE(update, context)\n\n_FINAL_REPAIR_OLD_TEXT_ROUTER = text_router\nasync def text_router(update, context):\n    if update.message and getattr(update.message, "text", None) and context.user_data.get("awaiting_custom_time"):\n        try:\n            if await custom_time_save(update, context):\n                return\n        except Exception:\n            logger.exception("Final manual goal time repair failed")\n            await update.message.reply_text("❌ ثبت ساعت انجام نشد. مثال: 18:30")\n            return\n    return await _FINAL_REPAIR_OLD_TEXT_ROUTER(update, context)\n\n'''
              s = s[:pos] + patch + s[pos:]

          compile(s, 'bot.py', 'exec')
          p.write_text(s, encoding='utf-8')
          print('bot.py repaired:', len(s.splitlines()), 'lines')
          PY
      - name: Static tests
        run: |
          python - <<'PY'
          import ast, re
          from pathlib import Path
          s = Path('bot.py').read_text(encoding='utf-8')
          ast.parse(s)
          ns = {'re': re}
          prefix = s[s.find('def normalize_digits'):s.find('\ndef parse_time', s.find('def normalize_digits'))]
          exec(prefix, ns)
          start = s.find('def parse_time(s):')
          end = s.find('\ndef ', start + 1)
          exec(s[start:end], ns)
          f = ns['parse_time']
          tests = {'18:30':'18:30','۱۸:۳۰':'18:30','8:05':'08:05','۰۸:۰۵':'08:05','1830':'18:30','18.30':'18:30'}
          for x, y in tests.items(): assert f(x) == y, (x, f(x), y)
          for x in ('24:00','18:60','abc','99999'): assert f(x) is None, (x, f(x))
          assert 'awaiting_custom_time' in s
          assert '# === ONE-TIME BUTTON/TIME REPAIR 2026-09-08 ===' in s
          print('PASS: AST + manual time + routing markers')
          PY
      - name: Commit repaired bot.py and remove one-time workflow
        run: |
          git config user.name 'Rezayadgari1'
          git config user.email 'm.m1380138296@gmail.com'
          rm -f .github/workflows/repair-bot.yml
          git add bot.py .github/workflows/repair-bot.yml
          git commit -m 'Fix goal manual time and broken buttons'
          git push origin HEAD:main
