name: quality\n\non:\n  push:\n  pull_request:\n\njobs:\n  python-quality:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n          cache: pip\n      - name: Install dependencies\n        run: python -m pip install -r requirements.txt\n      - name: Compile\n        run: python -m compileall -q bot.py database.py config.py tests\n      - name: Ruff correctness checks\n        run: python -m pip install ruff && ruff check .\n      - name: Structural health report\n        run: python tools/code_health.py\n      - name: Run test suite\n        run: python tests/run_all.py\n